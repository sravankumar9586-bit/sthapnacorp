<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ఖర్చులు · Field Expenses</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0D1B3E">
<link rel="manifest" href="/expense.webmanifest">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230D1B3E'/><text x='16' y='23' font-size='18' text-anchor='middle' fill='%23C9A84C'>₹</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;700&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* A phone-first expense book: one big button to add an expense, large Telugu labels, English underneath. */
:root{
  --navy:#0D1B3E;--navy2:#1f3864;--gold:#C9A84C;--bg:#f3f5f9;--card:#fff;--ink:#14213d;--muted:#5d6b82;--line:#dde3ec;
  --ok:#1d7a4a;--okbg:#e2f3ea;--warn:#8a5a00;--warnbg:#fdf1d6;--bad:#b3261e;--badbg:#fbe7e5;--fuel:#a35a00;--fuelbg:#fbf0e1;
  --r:14px;--f:"Noto Sans Telugu","Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;padding-bottom:calc(130px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
small,.en{display:block;font-size:12.5px;color:var(--muted);font-family:"Noto Sans",system-ui,sans-serif;line-height:1.3}
body.lang-en .te-only{display:none}
.top{background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:20}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.top .who{flex:1;min-width:0}
.top .who b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .who span{font-size:13px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.langbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.tabs{max-width:760px;margin:10px auto 0;display:flex;gap:6px;overflow-x:auto}
.tabs button{flex:1;min-width:max-content;background:transparent;border:0;color:#fff;opacity:.7;padding:8px 12px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
.tabs button[aria-selected=true]{opacity:1;background:rgba(255,255,255,.16)}
.tabs .cnt{background:var(--gold);color:var(--navy);border-radius:999px;padding:0 7px;margin-left:4px;font-size:13px}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 1px 2px rgba(13,27,62,.06);margin-bottom:12px}
h2{font-size:19px;margin:6px 0 10px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.sum div{background:var(--card);border-radius:12px;padding:12px}
.sum b{display:block;font-size:20px;font-family:"Noto Sans",sans-serif;white-space:nowrap}
.sum .lab{font-size:14px;color:var(--muted)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:15;background:var(--gold);color:var(--navy);border:0;border-radius:999px;padding:16px 28px;font-size:20px;font-weight:700;box-shadow:0 6px 18px rgba(13,27,62,.3);cursor:pointer;display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px)}
.fab small{color:var(--navy);opacity:.75;font-size:12px}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.ico{font-size:26px;width:44px;height:44px;border-radius:12px;background:var(--bg);display:grid;place-items:center;flex:none}
.item .mid{flex:1;min-width:0}
.item .mid b{display:block;font-size:16px}
.item .meta{font-size:13px;color:var(--muted)}
.item .amt{text-align:right;font-family:"Noto Sans",sans-serif;font-weight:700;font-size:17px;white-space:nowrap}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;margin-top:4px}
.st-submitted{background:var(--warnbg);color:var(--warn)}
.st-passed{background:var(--okbg);color:var(--ok)}
.st-cut{background:var(--fuelbg);color:var(--fuel)}
.st-rejected{background:var(--badbg);color:var(--bad)}
.flag{display:block;background:var(--badbg);color:var(--bad);border-radius:8px;padding:4px 8px;font-size:13px;margin-top:6px}
.flag.w{background:var(--warnbg);color:var(--warn)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.btn{border:0;border-radius:12px;padding:14px 18px;font-size:17px;font-weight:700;cursor:pointer;background:var(--navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.light{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.cut{background:var(--fuel)}
.btn.sm{padding:9px 13px;font-size:15px;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.f{display:block;margin:12px 0 4px;font-weight:600}
input.in,select.in,textarea.in{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;font-size:18px}
input.in:focus,select.in:focus,textarea.in:focus{outline:none;border-color:var(--navy2)}
input.big{font-size:34px;font-weight:700;text-align:center;font-family:"Noto Sans",sans-serif;padding:14px}
.err{background:var(--badbg);color:var(--bad);border-radius:10px;padding:10px 12px;margin-top:12px;font-weight:600}
.note{background:var(--warnbg);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:15px}
/* add-expense sheet */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:30;overflow-y:auto;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.sheet-h{background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:2}
.sheet-h b{flex:1;font-size:18px}
.sheet-h button{background:transparent;border:0;color:#fff;font-size:28px;line-height:1;cursor:pointer;padding:4px 8px}
.steps{display:flex;gap:6px;max-width:760px;margin:12px auto 0;padding:0 16px}
.steps i{flex:1;height:5px;border-radius:5px;background:var(--line)}
.steps i.on{background:var(--gold)}
.sheet .body{max-width:760px;margin:0 auto;padding:16px}
.q{font-size:22px;font-weight:700;margin:6px 0 2px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.tile{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center;cursor:pointer;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tile .e{font-size:34px;line-height:1}
.tile b{font-size:17px}
.tile[aria-pressed=true]{border-color:var(--navy);background:#eef2fa}
.tile.fuel .e{filter:none}
.choice{display:grid;gap:10px;margin-top:14px}
.choice .tile{flex-direction:row;justify-content:flex-start;text-align:left;min-height:76px;padding:14px 16px;gap:14px}
.choice .tile .e{font-size:32px}
.photo-prev{margin-top:12px;border-radius:12px;max-height:260px;max-width:100%;display:block;margin-inline:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips button{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;font-size:15px;cursor:pointer}
.navbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:3}
.navbar .in2{max-width:760px;margin:0 auto;display:flex;gap:10px;width:100%}
.navbar .btn{flex:1}
.review{background:#fff;border-radius:14px;padding:4px 14px}
.review div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.review div:first-child{border-top:0}
.review span:first-child{color:var(--muted)}
.review span:last-child{font-weight:600;text-align:right}
.done{text-align:center;padding:40px 10px}
.done .e{font-size:64px}
/* checking */
.chk{background:#fff;border-radius:var(--r);padding:14px;margin-bottom:12px}
.chk .hd{display:flex;gap:12px}
.chk img{width:84px;height:84px;object-fit:cover;border-radius:10px;cursor:pointer;flex:none;background:var(--bg)}
.chk .nophoto{width:84px;height:84px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:12px;color:var(--muted);text-align:center;flex:none}
.chk .acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.cutbox{margin-top:10px;background:var(--bg);border-radius:12px;padding:10px}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th,table.t td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{font-size:13px;color:var(--muted)}
table.t tr.tot td{font-weight:700}
.tw{overflow-x:auto}
.person{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.person:first-child{border-top:0}
.person .nm{flex:1;min-width:150px}
.person .nm b{display:block}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;display:grid;place-items:center;padding:16px}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-weight:600;max-width:calc(100% - 32px);text-align:center}
.center{max-width:460px;margin:40px auto;text-align:center}
.linkbox{word-break:break-all;background:var(--bg);border-radius:10px;padding:10px;font-size:14px;margin-top:8px}
@media print{
  .top,.fab,.noprint,.tabs{display:none!important}
  body{background:#fff;padding:0;font-size:12px}
  main{max-width:none;padding:0}
  .card{box-shadow:none;padding:0}
  table.t{font-size:11px}
}
</style>
</head>
<body>
<header class="top noprint" id="top" hidden>
  <div class="top-in">
    <div class="who"><b id="who-name"></b><span id="who-sub"></span></div>
    <button class="langbtn" id="lang" type="button">English</button>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</header>
<main id="main"><div class="center" id="boot">…</div></main>
<button class="fab noprint" id="fab" type="button" hidden>＋ <span>ఖర్చు రాయండి<small>Add expense</small></span></button>
<div class="sheet" id="sheet" hidden></div>
<div class="lightbox" id="lightbox" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
'use strict';
var API = '/api/expense';
var HEADS = [
  { h: 'Diesel', e: '⛽', te: 'డీజిల్', en: 'Diesel', fuel: true },
  { h: 'Petrol', e: '⛽', te: 'పెట్రోల్', en: 'Petrol', fuel: true },
  { h: 'Travelling Exp. / Local Conveyance', e: '🛺', te: 'ప్రయాణం / ఆటో', en: 'Travel / auto / bus' },
  { h: 'Rent / Elect.', e: '🏠', te: 'గది అద్దె / కరెంట్', en: 'Room rent / power' },
  { h: 'Service Exp.', e: '🧴', te: 'సర్ఫ్, సబ్బు, సామాను', en: 'Surf, soap, small items' },
  { h: 'Chemicals', e: '🧪', te: 'మందులు', en: 'Chemicals' },
  { h: 'Repairs & Maint.', e: '🔧', te: 'రిపేర్లు', en: 'Repairs' },
  { h: 'Printing & Stationery', e: '🖨️', te: 'జిరాక్స్ / స్టేషనరీ', en: 'Xerox / stationery' },
  { h: 'Office Maint. / Courier', e: '📦', te: 'కొరియర్', en: 'Courier' },
  { h: 'Misc. Exp.', e: '➕', te: 'ఇతర ఖర్చు', en: 'Other' }
];
var HEAD = {}; HEADS.forEach(function (x) { HEAD[x.h] = x; });
var S = { me: null, claims: [], team: [], sites: [], tab: 'mine', month: thisMonth(), site: '', lang: 'te', add: null, cut: null, admin: null };
try { S.lang = localStorage.getItem('exp_lang') || 'te'; } catch (e) {}

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function T(te, en) { return S.lang === 'en' ? esc(en) : esc(te) + '<small>' + esc(en) + '</small>'; }
function t1(te, en) { return S.lang === 'en' ? en : te; }
function rs(n) { return '₹' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 }); }
function today() { var d = new Date(Date.now() - new Date().getTimezoneOffset() * 60000); return d.toISOString().slice(0, 10); }
function thisMonth() { return today().slice(0, 7); }
function dm(iso) { var p = String(iso).split('-'); return p[2] + '.' + p[1]; }
function monthName(m) { var d = new Date(m + '-01T00:00:00'); return d.toLocaleDateString(S.lang === 'en' ? 'en-IN' : 'te-IN', { month: 'long', year: 'numeric' }); }
function toast(msg) { var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, 3200); }

function api(method, params, body) {
  var url = API + (method === 'GET' ? '?' + new URLSearchParams(params || {}).toString() : '');
  var opt = { method: method, credentials: 'same-origin', headers: {} };
  if (S.admin) opt.headers['x-admin-password'] = S.admin;
  if (body) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  return fetch(url, opt).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.error || 'Something went wrong. Try again.'); e.status = r.status; throw e; } return j; });
  }, function () { throw new Error(t1('ఇంటర్నెట్ లేదు. మళ్ళీ ప్రయత్నించండి.', 'No internet. Try again.')); });
}

/* ---------- start ---------- */
function boot() {
  document.body.className = 'lang-' + S.lang;
  var q = new URLSearchParams(location.search);
  if (q.has('admin')) return adminStart();
  var k = q.get('k');
  var go = k ? api('POST', null, { action: 'login', k: k }).then(function () { history.replaceState(null, '', '/expense'); }) : Promise.resolve();
  go.then(load).catch(function (e) { noAccess(e.message); });
}
function load() {
  return api('GET', { month: S.month, site_id: S.site }).then(function (d) {
    S.me = d.me; S.claims = d.claims; S.team = d.team || []; S.sites = d.sites || [];
    if (!S.started) { S.started = true; S.tab = S.me.role === 'employee' ? 'mine' : 'check'; }
    render();
  }).catch(function (e) { if (e.status === 401) noAccess(); else { $('main').innerHTML = '<div class="center"><div class="err">' + esc(e.message) + '</div><p><button class="btn" id="retry">' + T('మళ్ళీ', 'Try again') + '</button></p></div>'; } });
}
function noAccess(msg) {
  $('top').hidden = true; $('fab').hidden = true;
  $('main').innerHTML = '<div class="center card"><div style="font-size:54px">🔗</div><h2>' + T('మీ ఆఫీసు పంపిన లింక్ తెరవండి', 'Open the link your office sent you') + '</h2>' +
    '<p>' + T('ఈ పేజీ వాడటానికి వాట్సాప్‌లో వచ్చిన మీ సొంత లింక్‌ను నొక్కండి. లింక్ పని చేయకపోతే, కొత్త లింక్ కోసం ఆఫీసును అడగండి.', 'Tap your personal link from WhatsApp. If it does not work, ask the office for a new one.') + '</p>' +
    (msg ? '<p class="err">' + esc(msg) + '</p>' : '') + '</div>';
}

/* ---------- main screens ---------- */
function tabsFor() {
  var r = S.me.role, waiting = S.claims.filter(canCheck).length;
  var t = [];
  if (r !== 'employee') t.push(['check', t1('చెక్ చేయండి', 'To check'), waiting]);
  t.push(['mine', r === 'employee' ? t1('నా ఖర్చులు', 'My expenses') : t1('నావి', 'Mine')]);
  if (r !== 'employee') t.push(['register', t1('రిజిస్టర్', 'Register')]);
  if (r === 'office') t.push(['people', t1('సిబ్బంది', 'People')]);
  return t;
}
function canCheck(c) {
  if (c.status !== 'submitted') return false;
  if (S.me.role === 'office') return true;
  return S.me.role === 'supervisor' && c.person_id !== S.me.id && c.site_id === S.me.site_id;
}
function render() {
  document.body.className = 'lang-' + S.lang;
  $('top').hidden = false;
  $('lang').textContent = S.lang === 'en' ? 'తెలుగు' : 'English';
  $('who-name').textContent = S.me.name;
  $('who-sub').textContent = [S.me.company.name, S.me.site_code ? S.me.site_code + (S.me.site_name && S.me.site_name !== S.me.site_code ? ' · ' + S.me.site_name : '') : '', { employee: '', supervisor: t1('సూపర్వైజర్', 'Supervisor'), office: t1('ఆఫీసు', 'Office') }[S.me.role]].filter(Boolean).join(' · ');
  var tabs = tabsFor();
  $('tabs').hidden = tabs.length < 2;
  $('tabs').innerHTML = tabs.map(function (x) { return '<button role="tab" data-tab="' + x[0] + '" aria-selected="' + (S.tab === x[0]) + '">' + esc(x[1]) + (x[2] ? '<span class="cnt">' + x[2] + '</span>' : '') + '</button>'; }).join('');
  $('fab').hidden = S.tab === 'people';
  $('fab').innerHTML = '＋ <span>' + (S.lang === 'en' ? 'Add expense' : 'ఖర్చు రాయండి<small>Add expense</small>') + '</span>';
  var v = { mine: viewMine, check: viewCheck, register: viewRegister, people: viewPeople }[S.tab] || viewMine;
  $('main').innerHTML = v();
}
function monthBar() {
  return '<div class="row noprint" style="justify-content:space-between;margin-bottom:12px"><button class="btn light sm" data-month="-1">‹</button><b>' + esc(monthName(S.month)) + '</b><button class="btn light sm" data-month="1">›</button></div>';
}
function statusChip(c) {
  if (c.status === 'passed' && c.passed_amount < c.amount) return '<span class="chip st-cut">' + esc(t1('తగ్గించి పాస్ ', 'Passed ') + rs(c.passed_amount)) + '</span>';
  return '<span class="chip st-' + c.status + '">' + esc({ submitted: t1('చెక్ చేయాలి', 'Waiting'), passed: t1('పాస్ అయ్యింది', 'Passed'), rejected: t1('తిరస్కరించారు', 'Rejected') }[c.status]) + '</span>';
}
function headLabel(h) { var x = HEAD[h]; return x ? t1(x.te, x.en) : h; }
function line(c, opts) {
  var x = HEAD[c.head] || { e: '•' };
  var meta = [dm(c.spent_on), c.litres ? c.litres + ' L' + (c.vehicle ? ' · ' + c.vehicle : '') : '', c.bill ? t1('బిల్లు ఉంది', 'Bill') + (c.bill_no ? ' ' + c.bill_no : '') : t1('బిల్లు లేదు', 'No bill') + (c.payee ? ' · ' + c.payee : ''), c.pay_mode === 'Cash' ? t1('నగదు', 'Cash') : c.pay_mode, 'EV ' + c.ev_no].filter(Boolean).join(' · ');
  return '<div class="item"><div class="ico">' + x.e + '</div><div class="mid"><b>' + esc((opts && opts.who ? c.person_name + ' · ' : '') + headLabel(c.head)) + '</b><div class="meta">' + esc(meta) + '</div>' +
    (c.note ? '<div class="meta">' + esc(c.note) + '</div>' : '') + statusChip(c) + (c.reason ? '<div class="meta">' + esc(t1('కారణం: ', 'Reason: ') + c.reason) + '</div>' : '') +

function flags(c) {

  if (!c.bill && /Rent/.test(c.head)) out.push([0, t1('అద్దె రసీదు లేదు', 'Rent without receipt')]);
  if (!c.bill && nb && c.amount > nb) out.push([1, t1('బిల్లు లేకుండా పరిమితి ', 'Over the no-bill limit of ') + rs(nb)]);
  if (c.bill && !c.has_photo) out.push([0, t1('బిల్లు ఫోటో లేదు', 'Bill marked but no photo')]);
  if (c.pay_mode === 'Cash') {
    var who = (c.bill ? c.bill_no : c.payee) || '';
    var same = S.claims.filter(function (x) { return x.pay_mode === 'Cash' && x.spent_on === c.spent_on && ((x.bill ? x.bill_no : x.payee) || '') === who && x.status !== 'rejected'; });
    var sum = same.reduce(function (a, x) { return a + x.amount; }, 0);
    if (sum > lim) out.push([1, t1('ఒకే రోజు ఒకరికి నగదు ', 'Cash to one payee in a day: ') + rs(sum) + t1(' — ఇన్కమ్ టాక్స్‌లో ఖర్చుగా రాదు. UPI వాడాలి.', ' — not allowed as an expense in income tax. Use UPI.')]);
  }

}

function readStep() {

  if (A.step === 2) {
    A.amount = v('a-amount').replace(/,/g, ''); A.spent_on = v('a-date') || today();
    if (isFuelHead(A.head)) { A.litres = v('a-litres'); A.vehicle = v('a-vehicle'); }
    if (!(Number(A.amount) > 0)) return t1('డబ్బు మొత్తం రాయండి.', 'Enter the amount.');
    if (isFuelHead(A.head) && !(Number(A.litres) > 0)) return t1('లీటర్లు రాయండి.', 'Enter the litres.');
    if (A.spent_on > today()) return t1('రేపటి తేదీ కాకూడదు.', 'The date cannot be in the future.');
  }
  if (A.step === 3) {
    if (A.bill) A.bill_no = v('a-billno');
    if (A.bill === false) { A.payee = v('a-payee'); if (!A.payee) return t1('ఎవరికి ఇచ్చారో రాయండి.', 'Write who you paid.'); }
  }
  if (A.step === 4 && !A.pay_mode) return t1('ఎలా చెల్లించారో ఎంచుకోండి.', 'Choose how you paid.');
  if (A.step === 5) A.note = v('a-note');
  return '';
}
function shrink(file) {
  return new Promise(function (resolve, reject) {
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      var max = 1400, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      var q = 0.72, data = c.toDataURL('image/jpeg', q);
      while (data.length > 1.3e6 * 1.37 && q > 0.35) { q -= 0.12; data = c.toDataURL('image/jpeg', q); }
      resolve({ url: data, mime: 'image/jpeg', data: data.split(',')[1] });
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error(t1('ఫోటో తెరవలేదు. మళ్ళీ తీయండి.', 'Could not read the photo. Take it again.'))); };
    img.src = url;
  });
}
function send() {
  var A = S.add, e = readStep(); if (e) { A.err = e; return drawAdd(); }
  A.sending = true; A.err = ''; drawAdd();
  if (A.vehicle) try { localStorage.setItem('exp_vehicle', A.vehicle); } catch (x) {}
  api('POST', null, { action: 'submit', for_person_id: A.for_id, head: A.head, amount: A.amount, litres: A.litres, vehicle: A.vehicle, bill: A.bill, bill_no: A.bill_no, payee: A.payee,
    pay_mode: A.pay_mode, note: A.note, spent_on: A.spent_on, photo: A.photo ? { mime: A.photo.mime, data: A.photo.data } : null })
    .then(function (r) { A.sending = false; A.ev_no = r.ev_no; A.step = 9; drawAdd(); S.month = A.spent_on.slice(0, 7); load(); })
    .catch(function (x) { A.sending = false; A.err = x.message; drawAdd(); });
}

  /* admin */
  if (t.id === 'ad-go') { S.admin = $('ad-pass').value; return adminLoad().catch(function (e) { S.admin = null; $('ad-err').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }); }
  if (t.id === 'c-save') return api('POST', null, { action: 'company_save', name: $('c-name').value, address: $('c-addr').value, gstin: $('c-gstin').value, office_name: $('c-office').value, office_mobile: $('c-mobile').value })
    .then(function (r) { return adminLoad().then(function () { showAdminLink(r.link); }); }).catch(function (e) { $('c-err').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
  if (d.olink) return api('POST', null, { action: 'office_link', company_id: d.olink }).then(function (r) { showAdminLink(r.link); window.scrollTo(0, 0); }).catch(function (e) { toast(e.message); });
});
document.addEventListener('change', function (ev) {
  var t = ev.target;
  if (t.id === 'site-f') { S.site = t.value; return load(); }
  if (t.id === 'a-photo' && t.files && t.files[0]) {
    var A = S.add; A.err = t1('ఫోటో సిద్ధం చేస్తోంది…', 'Preparing the photo…'); drawAdd();
    shrink(t.files[0]).then(function (ph) { A.photo = ph; A.bill = true; A.payee = ''; A.err = ''; drawAdd(); }).catch(function (e) { A.err = e.message; drawAdd(); });
  }
});
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Enter' && S.add && ev.target.tagName === 'INPUT') { ev.preventDefault(); var b = document.querySelector('[data-next],#a-send'); if (b) b.click(); }
  if (ev.key === 'Escape' && !$('lightbox').hidden) $('lightbox').hidden = true;
});
$('lightbox').addEventListener('click', function () { this.hidden = true; });
boot();
})();
</script>
</body>
</html>
